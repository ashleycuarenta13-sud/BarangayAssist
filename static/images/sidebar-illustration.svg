  <!-- small tree, back -->
  <g opacity="0.5">
    <rect x="221" y="150" width="4" height="18" fill="#c7d6ce"/>
    <circle cx="223" cy="142" r="14" fill="#c7d6ce"/>
  </g>

  <!-- barangay hall silhouette -->
  <g>
    <rect x="55" y="175" width="105" height="45" fill="rgba(255,255,255,0.12)"/>
    <polygon points="45,175 165,175 105,150" fill="rgba(255,255,255,0.14)"/>
    <rect x="98" y="192" width="14" height="28" fill="#073b2a"/>
    <rect x="68" y="188" width="12" height="12" fill="#073b2a"/>
    <rect x="140" y="188" width="12" height="12" fill="#073b2a"/>
    <rect x="103" y="147" width="4" height="10" fill="rgba(255,255,255,0.14)"/>
    <circle cx="105" cy="143" r="5" fill="none" stroke="#f4c62e" stroke-width="1.5"/>
  </g>

  <!-- tree left -->
  <g opacity="0.6">
    <rect x="28" y="195" width="5" height="25" fill="#c7d6ce"/>
    <circle cx="30" cy="182" r="18" fill="#c7d6ce"/>
  </g>

  <!-- tree right -->
  <g opacity="0.6">
    <rect x="188" y="198" width="5" height="22" fill="#c7d6ce"/>
    <circle cx="190" cy="187" r="16" fill="#c7d6ce"/>
  </g>

  <!-- front hill -->
  <path d="M0 205 C 60 185, 130 200, 190 190 C 225 184, 250 198, 275 190 L 275 230 L 0 230 Z"
