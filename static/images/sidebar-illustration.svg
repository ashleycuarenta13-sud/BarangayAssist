<svg viewBox="0 0 275 230" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- back hill -->
  <path d="M0 130 C 40 100, 90 105, 140 125 C 190 145, 230 100, 275 115 L 275 230 L 0 230 Z"
        fill="rgba(255,255,255,0.05)"/>

  <!-- mid hill -->
  <path d="M0 165 C 55 130, 100 150, 150 140 C 205 128, 235 155, 275 140 L 275 230 L 0 230 Z"
